name: Backend CI/CD Pipeline

on:
  push:
    branches: [ "main", "improvements", "feature/cloud-migration" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-build:
    name: Build & Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Check Node.js Syntax & Compilation
        run: |
          for file in index.js database/db.js middleware/rateLimiter.js middleware/cacheHeaders.js utils/cloudStorage.js; do
            if [ -f "$file" ]; then
              node -c "$file"
            fi
          done

      - name: Test Docker Container Build
        run: docker build -t adilabad-backend:${{ github.sha }} .
