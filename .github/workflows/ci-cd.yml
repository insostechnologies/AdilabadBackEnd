name: Backend CI/CD Pipeline

on:
  push:
    branches: [ "main", "improvements", "feature/cloud-migration" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-build:
    name: Build & Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Check Node.js Syntax & Compilation
        run: |
          node -c index.js
          node -c database/db.js
          node -c middleware/rateLimiter.js
          node -c middleware/cacheHeaders.js
          node -c utils/cloudStorage.js

      - name: Test Docker Container Build
        run: docker build -t adilabad-backend:${{ github.sha }} .
